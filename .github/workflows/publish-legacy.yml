name: Publish legacy VPM index

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and validate saved index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/vpm-repos public/facetune-release
          python3 - <<'PY'
          import json
          from pathlib import Path

          def update_urls(value):
              if isinstance(value, dict):
                  return {key: update_urls(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [update_urls(item) for item in value]
              if isinstance(value, str):
                  return value.replace('https://github.com/Tliks/', 'https://github.com/aoyonn/').replace('https://github.com/tliks/', 'https://github.com/aoyonn/')
              return value

          listings = [
              ('index-baseline.json', 'com.aoyon.vpm', 'vpm-repos'),
              ('facetune-index-baseline.json', 'com.aoyon.ft-vpm', 'facetune-release'),
          ]
          for source, expected_id, path in listings:
              index = json.loads(Path(source).read_text(encoding='utf-8'))
              if index.get('id') != expected_id or not index.get('packages'):
                  raise ValueError(f'Unexpected or empty VPM index: {source}')
              index = update_urls(index)
              index['url'] = f'https://tliks.github.io/{path}/index.json'
              Path(f'public/{path}/index.json').write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
